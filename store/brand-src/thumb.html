<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Rubik; src: url(rubik-latin.woff2) format('woff2'); font-weight: 300 900; }
body { margin: 0; }
#c { position: relative; overflow: hidden; font-family: Rubik, 'Noto Color Emoji', sans-serif;
  background: radial-gradient(circle at 30% 45%, #ff3b4f, #c8001a 55%, #6d000e); }
.rays { position: absolute; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.13) 0 9deg, rgba(255,255,255,0) 9deg 18deg); }
.band { position: absolute; left: 0; right: 0; height: 14px; display: flex; z-index: 5; } .band i { flex: 1; }
.logo { position: absolute; filter: drop-shadow(0 14px 26px rgba(0,0,0,.5)); }
.phone { position: absolute; background: #111; border-radius: 34px; padding: 14px; box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 0 4px #333; }
.phone img { width: 100%; display: block; border-radius: 22px; }
.title { position: absolute; color: #fff; font-weight: 900; line-height: .95; text-shadow: 0 6px 0 #7a0010, 0 12px 28px rgba(0,0,0,.45); letter-spacing: -.01em; }
.title span { display: block; }
.title .y { color: #FFD54A; }
.tag { position: absolute; background: #FFD54A; color: #7a2e00; font-weight: 900; border-radius: 999px; box-shadow: 0 8px 18px rgba(0,0,0,.4); border: 5px solid #fff; white-space: nowrap; }
.em { position: absolute; filter: drop-shadow(0 8px 12px rgba(0,0,0,.45)); line-height: 1; }
</style></head><body><div id="c"></div>
<script>
const V = new URLSearchParams(location.search).get('v') === 'tall';
const W = V ? 1080 : 1280, H = V ? 1920 : 720;
const c = document.getElementById('c'); c.style.width = W + 'px'; c.style.height = H + 'px';
const COLORS = ['#0fa3a3', '#e2337f', '#f5c400', '#f08a00', '#8e44ad', '#6fae12', '#c0392b', '#7f8c8d'];
const band = (pos) => `<div class="band" style="${pos}:0">${COLORS.map((x) => `<i style="background:${x}"></i>`).join('')}</div>`;
const R = V ? 2600 : 2000;
c.innerHTML = band('top') + band('bottom') +
  `<div class="rays" style="width:${R}px;height:${R}px;left:${(V ? W / 2 : W * 0.3) - R / 2}px;top:${(V ? H * 0.3 : H / 2) - R / 2}px"></div>` +
  (V
    ? `<img class="logo" src="logo-full.png" style="width:520px;left:280px;top:90px">
       <div class="title" style="font-size:150px;left:0;right:0;text-align:center;top:650px"><span>BUY.</span><span>BUILD.</span><span class="y">GET RICH!</span></div>
       <div class="phone" style="width:470px;left:300px;top:1180px;transform:rotate(-6deg)"><img src="thumb-board.png"></div>
       <div class="tag" style="font-size:54px;padding:14px 40px;left:50%;top:1760px;transform:translateX(-50%) rotate(-3deg)">PLAY FREE 🎲</div>
       <div class="em" style="font-size:150px;left:70px;top:1230px;transform:rotate(-15deg)">🎲</div>
       <div class="em" style="font-size:130px;right:60px;top:1350px;transform:rotate(12deg)">💰</div>
       <div class="em" style="font-size:110px;left:90px;top:1500px">🏨</div>`
    : `<div class="title" style="font-size:108px;left:56px;top:150px"><span>BUY.</span><span>BUILD.</span><span class="y">GET RICH!</span></div>
       <div class="tag" style="font-size:40px;padding:10px 30px;left:60px;top:560px;transform:rotate(-3deg)">DEAL CITY · PLAY FREE 🎲</div>
       <div class="phone" style="width:300px;left:900px;top:70px;transform:rotate(7deg)"><img src="thumb-board.png"></div>
       <img class="logo" src="logo-full.png" style="width:290px;left:660px;top:390px;transform:rotate(-6deg)">
       <div class="em" style="font-size:110px;left:700px;top:40px;transform:rotate(-14deg)">🎲</div>
       <div class="em" style="font-size:96px;left:1150px;top:560px;transform:rotate(10deg)">💰</div>`);
window.ready = document.fonts.ready;
</script></body></html>
