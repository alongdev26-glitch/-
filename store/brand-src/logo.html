<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Rubik; src: url(rubik-latin.woff2) format('woff2'); font-weight: 300 900; }
html, body { margin: 0; background: transparent; }
svg { display: block; }
</style></head>
<body>
<!-- ?bg=1 paints the gold square behind (app icons); ?s= scales the tile -->
<svg id="logo" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/><stop offset=".35" stop-color="#f5c542"/><stop offset=".7" stop-color="#d99a12"/><stop offset="1" stop-color="#a86a05"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe58a"/><stop offset=".5" stop-color="#c98a10"/><stop offset="1" stop-color="#8a5600"/>
    </linearGradient>
    <radialGradient id="bgGold" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#ffe48a"/><stop offset=".45" stop-color="#f5c542"/><stop offset="1" stop-color="#c98a10"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fc3ff"/><stop offset=".55" stop-color="#a8e2ff"/><stop offset="1" stop-color="#ffe9b8"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b5fb8"/><stop offset=".5" stop-color="#3d8fe6"/><stop offset="1" stop-color="#174f9c"/></linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b7f7f"/><stop offset=".5" stop-color="#18b5b0"/><stop offset="1" stop-color="#0a6b6b"/></linearGradient>
    <linearGradient id="glassC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a2e8c"/><stop offset=".5" stop-color="#9b55c8"/><stop offset="1" stop-color="#5a2678"/></linearGradient>
    <linearGradient id="glassD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c0392b"/><stop offset=".5" stop-color="#e8604f"/><stop offset="1" stop-color="#a02a1e"/></linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b37c06"/><stop offset=".45" stop-color="#ffd84d"/><stop offset="1" stop-color="#a86a05"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b4f"/><stop offset=".6" stop-color="#d4001a"/><stop offset="1" stop-color="#8f0012"/></linearGradient>
    <linearGradient id="ribbonBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3001a"/><stop offset="1" stop-color="#6d000d"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8d0"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#e09a10"/></linearGradient>
    <radialGradient id="coin" cx=".38" cy=".3" r=".75"><stop offset="0" stop-color="#fff6c4"/><stop offset=".4" stop-color="#ffd23f"/><stop offset=".8" stop-color="#e0a526"/><stop offset="1" stop-color="#a8740b"/></radialGradient>
    <linearGradient id="dieFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e2d2"/></linearGradient>
    <clipPath id="inner"><rect x="96" y="96" width="832" height="832" rx="150"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>

  <defs>
      <g id="stack">
        <ellipse cx="0" cy="0" rx="62" ry="22" fill="#a8740b"/>
        <rect x="-62" y="-16" width="124" height="16" fill="#e0a526"/><ellipse cx="0" cy="-16" rx="62" ry="22" fill="url(#coin)" stroke="#b07a0a" stroke-width="3"/>
        <rect x="-62" y="-40" width="124" height="24" fill="#e0a526"/><ellipse cx="0" cy="-40" rx="62" ry="22" fill="url(#coin)" stroke="#b07a0a" stroke-width="3"/>
        <rect x="-62" y="-64" width="124" height="24" fill="#e0a526"/><ellipse cx="0" cy="-64" rx="62" ry="22" fill="url(#coin)" stroke="#b07a0a" stroke-width="3"/>
        <text x="0" y="-55" text-anchor="middle" font-family="Rubik" font-weight="900" font-size="30" fill="#a86a05">$</text>
      </g>
  </defs>
  <rect id="bg" x="0" y="0" width="1024" height="1024" fill="url(#bgGold)" display="none"/>
  <g id="tile">
    <!-- gold frame -->
    <rect x="48" y="56" width="928" height="928" rx="196" fill="#8a5600" opacity=".45"/>
    <rect x="48" y="40" width="928" height="928" rx="196" fill="url(#goldEdge)"/>
    <rect x="64" y="56" width="896" height="896" rx="182" fill="url(#gold)"/>
    <rect x="96" y="96" width="832" height="832" rx="150" fill="url(#sky)"/>

    <g clip-path="url(#inner)">
      <!-- sun glow + clouds -->
      <circle cx="760" cy="330" r="170" fill="#fff6c8" opacity=".55"/>
      <g fill="#fff" opacity=".9">
        <ellipse cx="250" cy="330" rx="90" ry="30"/><ellipse cx="300" cy="312" rx="60" ry="34"/>
        <ellipse cx="770" cy="420" rx="80" ry="26"/><ellipse cx="815" cy="404" rx="50" ry="28"/>
      </g>
      <!-- the skyline -->
      <g filter="url(#sh2)">
        <!-- back buildings -->
        <rect x="150" y="560" width="120" height="400" fill="url(#glassC)"/>
        <rect x="740" y="520" width="140" height="440" fill="url(#glassB)"/>
        <!-- mid -->
        <rect x="250" y="470" width="140" height="490" rx="6" fill="url(#glassA)"/>
        <path d="M250 470 L320 420 L390 470 Z" fill="#174f9c"/>
        <rect x="620" y="440" width="140" height="520" rx="6" fill="url(#glassD)"/>
        <rect x="640" y="415" width="100" height="30" fill="#a02a1e"/>
        <!-- the gold tower -->
        <rect x="420" y="330" width="184" height="640" rx="10" fill="url(#tower)"/>
        <path d="M420 330 L512 230 L604 330 Z" fill="#e0a526"/>
        <rect x="506" y="160" width="12" height="80" fill="#c98a10"/>
        <circle cx="512" cy="156" r="14" fill="#ff3b4f"/>
      </g>
      <!-- windows -->
      <g fill="#fff3b0" opacity=".9">
        <g id="w1"><rect x="275" y="500" width="30" height="34" rx="4"/><rect x="335" y="500" width="30" height="34" rx="4"/></g>
        <use href="#w1" y="70"/><use href="#w1" y="140"/><use href="#w1" y="210"/><use href="#w1" y="280"/>
        <g id="w2"><rect x="645" y="470" width="30" height="34" rx="4"/><rect x="705" y="470" width="30" height="34" rx="4"/></g>
        <use href="#w2" y="70"/><use href="#w2" y="140"/><use href="#w2" y="210"/><use href="#w2" y="280"/>
        <g id="w3" fill="#fffbe0"><rect x="448" y="370" width="34" height="40" rx="4"/><rect x="495" y="370" width="34" height="40" rx="4"/><rect x="542" y="370" width="34" height="40" rx="4"/></g>
        <use href="#w3" y="75"/><use href="#w3" y="150"/><use href="#w3" y="225"/><use href="#w3" y="300"/><use href="#w3" y="375"/>
        <g id="w4"><rect x="170" y="590" width="26" height="30" rx="4"/><rect x="222" y="590" width="26" height="30" rx="4"/></g>
        <use href="#w4" y="65"/><use href="#w4" y="130"/>
        <g id="w5"><rect x="762" y="550" width="28" height="32" rx="4"/><rect x="826" y="550" width="28" height="32" rx="4"/></g>
        <use href="#w5" y="66"/><use href="#w5" y="132"/>
      </g>
      <!-- board ground with the colored strip -->
      <path d="M96 790 L928 790 L928 940 L96 940 Z" fill="#d9f2df"/>
      <g>
        <rect x="96" y="790" width="104" height="22" fill="#0fa3a3"/><rect x="200" y="790" width="104" height="22" fill="#6fae12"/>
        <rect x="304" y="790" width="104" height="22" fill="#2e86de"/><rect x="408" y="790" width="104" height="22" fill="#8e44ad"/>
        <rect x="512" y="790" width="104" height="22" fill="#f08a00"/><rect x="616" y="790" width="104" height="22" fill="#e2337f"/>
        <rect x="720" y="790" width="104" height="22" fill="#c0392b"/><rect x="824" y="790" width="104" height="22" fill="#c99a06"/>
      </g>
      <g stroke="#9cc7a8" stroke-width="3" opacity=".8">
        <line x1="96" y1="860" x2="928" y2="860"/><line x1="300" y1="812" x2="260" y2="940"/><line x1="512" y1="812" x2="512" y2="940"/><line x1="724" y1="812" x2="764" y2="940"/>
      </g>
    </g>

    <!-- coin stacks (left) -->
    <g filter="url(#sh)">
      <use href="#stack" x="225" y="880"/>
      <g transform="translate(330 900) scale(.8)">
        <use href="#stack"/>
      </g>
      <g transform="translate(175 920) scale(.7)"><ellipse cx="0" cy="0" rx="62" ry="22" fill="url(#coin)" stroke="#b07a0a" stroke-width="3"/></g>
    </g>

    <!-- dice (right) -->
    <g filter="url(#sh)">
      <g transform="translate(705 870) rotate(-14)">
        <rect x="-70" y="-70" width="140" height="140" rx="28" fill="url(#dieFace)" stroke="#cfc6b2" stroke-width="3"/>
        <g fill="#222"><circle cx="-34" cy="-34" r="13"/><circle cx="34" cy="-34" r="13"/><circle cx="0" cy="0" r="13"/><circle cx="-34" cy="34" r="13"/><circle cx="34" cy="34" r="13"/></g>
      </g>
      <g transform="translate(838 900) rotate(12)">
        <rect x="-58" y="-58" width="116" height="116" rx="24" fill="url(#dieFace)" stroke="#cfc6b2" stroke-width="3"/>
        <g fill="#222"><circle cx="-28" cy="-28" r="11"/><circle cx="28" cy="-28" r="11"/><circle cx="-28" cy="0" r="11"/><circle cx="28" cy="0" r="11"/><circle cx="-28" cy="28" r="11"/><circle cx="28" cy="28" r="11"/></g>
      </g>
    </g>

    <!-- ribbon with the name -->
    <g filter="url(#sh)">
      <path d="M40 205 L150 180 L150 330 L40 350 L85 270 Z" fill="url(#ribbonBack)"/>
      <path d="M984 205 L874 180 L874 330 L984 350 L939 270 Z" fill="url(#ribbonBack)"/>
      <path d="M110 165 Q512 95 914 165 L914 310 Q512 240 110 310 Z" fill="url(#ribbon)" stroke="#7a000e" stroke-width="5"/>
      <path d="M130 180 Q512 112 894 180" fill="none" stroke="#ff8a96" stroke-width="5" opacity=".6"/>
    </g>
    <defs><path id="arc" d="M150 268 Q512 196 874 268"/></defs>
    <text font-family="Rubik" font-weight="900" font-size="118" letter-spacing="2" text-anchor="middle" stroke="#5a1a00" stroke-width="14" stroke-linejoin="round" fill="#5a1a00"><textPath href="#arc" startOffset="50%">DEAL CITY</textPath></text>
    <text font-family="Rubik" font-weight="900" font-size="118" letter-spacing="2" text-anchor="middle" fill="url(#txt)"><textPath href="#arc" startOffset="50%">DEAL CITY</textPath></text>
  </g>
</svg>
<script>
const q = new URLSearchParams(location.search);
if (q.get('bg')) document.getElementById('bg').setAttribute('display', 'inline');
const s = +(q.get('s') || 1);
document.getElementById('tile').setAttribute('transform', `translate(${512 - 512 * s} ${512 - 512 * s}) scale(${s})`);
</script>
</body></html>
