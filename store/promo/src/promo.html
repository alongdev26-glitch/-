<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Rubik; src: url(rubik-hebrew.woff2) format('woff2'); font-weight: 300 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
@font-face { font-family: Rubik; src: url(rubik-latin.woff2) format('woff2'); font-weight: 300 900; unicode-range: U+0000-00FF, U+2000-206F; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; background: #000; }
body { font-family: Rubik, 'Noto Color Emoji', sans-serif; }
#stage { position: relative; overflow: hidden; background: radial-gradient(circle at 50% 40%, #2e9bff, #0d4fa3 70%, #082f66); }
.abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
.c { transform-origin: 50% 50%; }
.band { position: absolute; left: 0; right: 0; display: flex; z-index: 50; }
.band i { flex: 1; }
.rays { border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.16) 0 10deg, rgba(255,255,255,0) 10deg 20deg); }
.headline { color: #fff; font-weight: 900; text-align: center; line-height: 1.05; text-shadow: 0 .06em .18em rgba(0,0,0,.45); white-space: nowrap; }
.headline .w { display: inline-block; }
.sub { color: #FFD54A; font-weight: 800; text-align: center; text-shadow: 0 .06em .16em rgba(0,0,0,.45); white-space: nowrap; }
.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c4, #ffd23f 35%, #e0a526 70%, #a8740b); box-shadow: inset 0 0 0 .09em #c98a10, 0 .05em .12em rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; color: #9a6400; font-weight: 900; }
.die { background: linear-gradient(145deg, #fff, #ece6da); border-radius: 18%; box-shadow: inset 0 -.06em .1em rgba(0,0,0,.18), 0 .08em .2em rgba(0,0,0,.4); }
.die b { position: absolute; width: 19%; height: 19%; border-radius: 50%; background: #222; transform: translate(-50%,-50%); }
.phone { border-radius: 7%/3.9%; background: #111; padding: 3.2%; box-shadow: 0 .4em 1.2em rgba(0,0,0,.5), inset 0 0 0 .12em #333; }
.phone .scr { width: 100%; height: 100%; border-radius: 5%/2.8%; overflow: hidden; position: relative; background: #000; }
.phone img { width: 100%; height: 100%; display: block; }
.tok { border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, #fff, #f3f3f3 55%, #ddd); box-shadow: 0 .06em .14em rgba(0,0,0,.4); }
.stamp { color: #fff; background: #E3001B; border: .08em solid #fff; border-radius: .3em; font-weight: 900; padding: .08em .35em; box-shadow: 0 .08em .2em rgba(0,0,0,.4); white-space: nowrap; }
.tile { background: #fff; border-radius: .14em; box-shadow: 0 .06em .2em rgba(0,0,0,.35); overflow: hidden; display: flex; flex-direction: column; align-items: center; }
.tile .hd { width: 100%; height: 24%; }
.tile .nm { font-weight: 800; color: #222; margin-top: 12%; text-align: center; line-height: 1.1; }
.tile .pr { font-weight: 700; color: #555; margin-top: auto; margin-bottom: 9%; }
.counter { background: #fff; border-radius: 1em; font-weight: 900; color: #1b7a2f; padding: .15em .7em; box-shadow: 0 .08em .25em rgba(0,0,0,.35); white-space: nowrap; direction: rtl; }
.card { border-radius: .12em; box-shadow: 0 .06em .2em rgba(0,0,0,.4); backface-visibility: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.card.blue { background: linear-gradient(150deg, #4fc3ff, #1e88e5 50%, #0d4fa3); border: .04em solid #fff; }
.card.pink { background: linear-gradient(150deg, #ff7ac2, #e0218a 55%, #a3105e); border: .04em solid #fff; }
.card.face { background: #fffdf5; border: .04em solid #e8dcc0; color: #222; text-align: center; padding: 8%; line-height: 1.2; }
.card .lbl { color: #fff; background: rgba(0,0,0,.18); border-radius: 1em; font-weight: 800; padding: .05em .5em; margin-top: 8%; white-space: nowrap; }
.card .q { color: #fff; font-weight: 900; line-height: 1; text-shadow: 0 .04em .08em rgba(0,0,0,.3); }
.flagcard { background: #fff; border-radius: .16em; box-shadow: 0 .06em .2em rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.flagcard .fl { line-height: 1; }
.flagcard .ln { font-weight: 800; color: #222; margin-top: .12em; white-space: nowrap; }
.flagcard .ed { color: #666; font-weight: 500; white-space: nowrap; }
.av { border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; }
.badge { background: linear-gradient(#ffe48a, #f5c542 50%, #c98a10); color: #5a3a00; border-radius: 1em; font-weight: 900; padding: .1em .6em; box-shadow: 0 .08em .25em rgba(0,0,0,.4), inset 0 0 0 .06em #fff6; white-space: nowrap; }
.cta { background: linear-gradient(#ff3b4f, #E3001B 55%, #a10013); color: #fff; border-radius: 1em; font-weight: 900; padding: .18em .9em; box-shadow: 0 .1em 0 #7a000e, 0 .2em .4em rgba(0,0,0,.4); white-space: nowrap; }
.url { color: #fff; font-weight: 600; opacity: .95; white-space: nowrap; direction: ltr; }
.shine { background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.65) 50%, transparent 65%); mix-blend-mode: overlay; }
.flash { background: #fff; }
.z3, .cta, .url, .sub { z-index: 3; }
html[dir=ltr] .counter, html[dir=ltr] .badge, html[dir=ltr] .stamp { direction: ltr; }
.spark { color: #fff7c0; text-shadow: 0 0 .3em #ffd23f; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const q = Object.fromEntries(new URLSearchParams(location.search));
const LANG = q.lang || 'he', EN = LANG === 'en';
const L = (he, en) => (EN ? en : he);
const CUR = EN ? '$' : '₪';
if (EN) { document.documentElement.dir = 'ltr'; document.documentElement.lang = 'en'; }
const W = +(q.w || 1080), H = +(q.h || 1920), LAND = W > H;
const U = Math.min(W, H) / 100;           // 1 unit = 1% of the short side
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const CX = W / 2, CY = H / 2;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = (k) => 1 - Math.pow(1 - k, 3);
const eIn = (k) => k * k * k;
const eInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eBack = (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const eElastic = (k) => (k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3) + 1);
const eBounce = (k) => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375; return n * (k -= 2.625 / d) * k + 0.984375; };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function el(cls, parent = stage, html = '', tag = 'div') {
  const e = document.createElement(tag); e.className = 'abs ' + cls; if (html) e.innerHTML = html; parent.appendChild(e); return e;
}
// place an element centered at (x,y) with size, scale, rotation, opacity
function put(e, { x = 0, y = 0, w, h, s = 1, r = 0, o = 1, ry = 0, rx = 0, fs } = {}) {
  if (w != null) e.style.width = w + 'px';
  if (h != null) e.style.height = h + 'px';
  if (fs != null) e.style.fontSize = fs + 'px';
  e.style.display = o <= 0.001 ? 'none' : '';
  const ww = w != null ? w : e.offsetWidth, hh = h != null ? h : e.offsetHeight;
  e.style.transform = `translate(${x - ww / 2}px, ${y - hh / 2}px) perspective(${40 * U}px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${s})`;
  e.style.opacity = o;
}
const hide = (e) => { e.style.opacity = 0; e.style.display = 'none'; };

// ---------- scenes timeline ----------
const T = (() => { const x = new XMLHttpRequest(); x.open('GET', 'timeline.json', false); x.send(); return JSON.parse(x.responseText); })();
const DURATION = T.end[1];
// scene visibility: in over 0.35s, out over 0.3s (the last scene stays)
function vis(t, [a, b], last) {
  const i = eOut(prog(t, a, a + 0.35)); const o = last ? 1 : 1 - eIn(prog(t, b - 0.3, b));
  return { i, o, v: t >= a && t < (last ? 1e9 : b), k: Math.min(i, o) };
}

// text block: where headlines go in each layout
const TXT = LAND ? { x: W * 0.72, y: H * 0.42, fs: 7.6 * U, subY: H * 0.58, subFs: 4.2 * U }
                 : { x: CX, y: H * 0.13, fs: 9.2 * U, subY: H * 0.195, subFs: 5 * U };
const VIS = LAND ? { x: W * 0.3, y: CY } : { x: CX, y: H * 0.58 };

function headline(text) {
  const e = el('headline'); e.innerHTML = text.split(' ').map((w) => `<span class="w">${w}</span>`).join(' '); return e;
}
function animHeadline(e, t, a, y = TXT.y, fs = TXT.fs, x = TXT.x, out = 1) {
  e.style.fontSize = fs + 'px';
  // long headlines shrink to fit the frame
  const maxW = LAND ? W * 0.46 : W * 0.9;
  e.style.display = '';
  if (e.scrollWidth > maxW) e.style.fontSize = (fs * maxW) / e.scrollWidth + 'px';
  const words = [...e.querySelectorAll('.w')];
  words.forEach((w, i) => { const k = eBack(prog(t, a + i * 0.09, a + i * 0.09 + 0.45)); w.style.transform = `translateY(${(1 - k) * 0.6}em) scale(${0.4 + 0.6 * k})`; w.style.opacity = clamp(k * 1.5); });
  put(e, { x, y, o: out });
}

// ---------- shared background ----------
const rays = el('rays c');
const bgCoins = [];
{ const R = rng(7); for (let i = 0; i < 18; i++) bgCoins.push({ e: el('coin', stage, CUR), x: R() * W, sp: 0.04 + R() * 0.07, d: (2 + R() * 3.5) * U, ph: R() * 10, rot: R() * 360 }); }
const bandTop = el('band'), bandBot = el('band');
const COLORS = ['#0fa3a3', '#6fae12', '#2e86de', '#8e44ad', '#f08a00', '#e2337f', '#c0392b', '#c99a06'];
for (const b of [bandTop, bandBot]) { b.innerHTML = COLORS.map((c) => `<i style="background:${c}"></i>`).join(''); b.style.height = 1.6 * U + 'px'; b.style.width = W + 'px'; }
// transition wipe: 8 colored bars sweeping across
const wipe = el('band'); wipe.style.flexDirection = 'column'; wipe.innerHTML = COLORS.map((c) => `<i style="background:${c}"></i>`).join('');
const flash = el('flash'); flash.style.width = W + 'px'; flash.style.height = H + 'px'; flash.style.zIndex = 60;

// ---------- scene 1: logo ----------
const S1 = {};
S1.d1 = el('die'); S1.d2 = el('die');
S1.logo = el('c', stage, `<img src="icon.png" style="width:100%;height:100%;border-radius:22%;box-shadow:0 1.2em 2.4em rgba(0,0,0,.45)">`);
S1.shineWrap = el('c'); S1.shineWrap.style.overflow = 'hidden'; S1.shineWrap.style.borderRadius = '22%'; S1.shine = el('shine', S1.shineWrap);
S1.title = headline(L("דיל סיטי", "Deal City")); S1.sub = el('sub', stage, L("קונים · בונים · מנצחים", "Buy \u00b7 Build \u00b7 Win"));
S1.burst = []; { const R = rng(11); for (let i = 0; i < 26; i++) S1.burst.push({ e: el('coin', stage, CUR), a: R() * Math.PI * 2, v: (40 + R() * 55) * U, d: (3 + R() * 3) * U, spin: (R() - 0.5) * 900 }); }
const PIPS = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]], 5: [[27, 27], [73, 27], [50, 50], [27, 73], [73, 73]], 6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]] };
function dieFace(e, n) { if (e._n === n) return; e._n = n; e.innerHTML = PIPS[n].map(([x, y]) => `<b style="left:${x}%;top:${y}%"></b>`).join(''); }

function scene1(t) {
  const V = vis(t, T.logo); const all = [S1.d1, S1.d2, S1.logo, S1.shineWrap, S1.title, S1.sub, ...S1.burst.map((b) => b.e)];
  if (!V.v) return all.forEach(hide);
  const out = V.o;
  const LS = (LAND ? 38 : 58) * U;                      // logo size
  const LY = LAND ? CY - 17 * U : H * 0.42;
  // dice tumble in from both sides and bounce on the floor under the logo
  const floor = LY + LS * 0.5 + (LAND ? 7 : 14) * U, ds = (LAND ? 9 : 14) * U;
  [[S1.d1, -1, 0], [S1.d2, 1, 0.12]].forEach(([d, side, delay]) => {
    const k = prog(t, 0.05 + delay, 0.95 + delay);
    const x = CX + side * lerp(W * 0.75, (LAND ? 17 : 15) * U, eOut(k));
    const y = lerp(-ds, floor, eBounce(k));
    const rolling = k < 0.85; dieFace(d, rolling ? 1 + Math.floor(t * 17 + side * 3 + 9) % 6 : side < 0 ? 6 : 5);
    const pop = eBack(prog(t, 2.1, 2.5)); // a little hop when the title lands
    put(d, { x, y: y - Math.sin(pop * Math.PI) * 3 * U, w: ds, h: ds, r: (1 - eOut(k)) * side * -720 + side * 12, o: out });
  });
  // logo slams in at 0.9s with a squash
  const lk = prog(t, 0.85, 1.25), s = lk <= 0 ? 0 : lerp(3.2, 1, eIn(lk));
  const squash = lk >= 1 ? 1 + 0.08 * Math.sin(prog(t, 1.25, 1.65) * Math.PI) * (1 - prog(t, 1.25, 1.65)) : 1;
  const breathe = 1 + 0.015 * Math.sin(t * 4);
  put(S1.logo, { x: CX, y: LY, w: LS, h: LS, s: s * squash * breathe, o: lk <= 0 ? 0 : Math.min(1, lk * 3) * out, r: (1 - eOut(lk)) * -8 });
  // shine sweep
  const sk = prog(t, 1.55, 2.25);
  put(S1.shineWrap, { x: CX, y: LY, w: LS, h: LS, s: breathe, o: sk > 0 && sk < 1 ? out : 0 });
  put(S1.shine, { x: LS / 2 + lerp(-LS, LS, sk), y: LS / 2, w: LS, h: LS });
  // coin burst from the slam
  S1.burst.forEach((b) => {
    const bt = t - 1.2; if (bt < 0) return hide(b.e);
    const x = CX + Math.cos(b.a) * b.v * bt, y = LY + Math.sin(b.a) * b.v * bt + 0.5 * 140 * U * bt * bt;
    put(b.e, { x, y, w: b.d, h: b.d, fs: b.d * 0.55, r: b.spin * bt, o: clamp(1.8 - bt) * out });
  });
  const ty = LAND ? floor + 10 * U : floor + 16 * U;
  animHeadline(S1.title, t, 1.45, ty, (LAND ? 11 : 14) * U, CX, out);
  put(S1.sub, { x: CX, y: ty + (LAND ? 9.5 : 12) * U, fs: (LAND ? 4.6 : 5.6) * U, o: eOut(prog(t, 1.9, 2.3)) * out, s: lerp(0.7, 1, eBack(prog(t, 1.9, 2.3))) });
}

// ---------- phone helper ----------
function makePhone(src) { const p = el('phone c'); p.innerHTML = `<div class="scr"><img src="${src}"></div>`; return p; }
const PH = (LAND ? 76 : 104) * U;  // phone height (in units of the short side)
const PW = PH * 0.5625 * 1.07;

// ---------- scene 2: board ----------
const S2 = { phone: makePhone(`${LANG}-2-board.png`) }; S2.scr = S2.phone.querySelector('.scr');
S2.tok = el('tok', S2.scr, '🐈'); S2.tok.style.boxShadow = '0 0 0 .12em #FF8A00, 0 .1em .2em rgba(0,0,0,.5)';
S2.stamp = el('stamp', S2.scr, L("נקנה! 🏠", "SOLD! \ud83c\udfe0"));
S2.h = headline(L("קונים רחובות", "Buy streets")); S2.s = el('sub', stage, L("בערים אמיתיות", "in real cities"));
S2.dice = el('counter c'); S2.dice.style.direction = 'ltr'; S2.chips = el('url c', stage, '<span style="background:rgba(0,0,0,.28);border-radius:1em;padding:.2em .7em">' + L("40 משבצות · 22 רחובות · 4 רכבות", "40 squares \u00b7 22 streets \u00b7 4 stations") + '</span>'); S2.chips.style.direction = EN ? 'ltr' : 'rtl';
// squares in the 1080×1920 screenshot: GO bottom-left, then up the left column
const PATH = [[95, 1515], [95, 1405], [95, 1321], [95, 1237], [95, 1153]];
function scene2(t) {
  const V = vis(t, T.board); if (!V.v) return [S2.phone, S2.h, S2.s, S2.dice, S2.chips].forEach(hide);
  const lt = t - T.board[0];
  const ik = eBack(prog(lt, 0, 0.6));
  const float = Math.sin(lt * 2.2) * 1.2 * U;
  const zoom = 1 + 0.06 * eInOut(prog(lt, 0.8, 3.6));
  put(S2.phone, { x: VIS.x, y: VIS.y + (1 - ik) * H * 0.7 + float, w: PW, h: PH, r: (1 - ik) * 14 + Math.sin(lt * 1.6) * 1.2, ry: 0, s: zoom, o: V.o });
  const sw = S2.scr.offsetWidth, k = sw / 1080;
  // token hops 3 squares, then the buy stamp
  const hops = [1.0, 1.45, 1.9]; let pos = PATH[0], lift = 0;
  hops.forEach((h0, i) => { const hk = prog(lt, h0, h0 + 0.36); if (hk > 0) { pos = [lerp(PATH[i][0], PATH[i + 1][0], hk), lerp(PATH[i][1], PATH[i + 1][1], hk)]; lift = Math.sin(hk * Math.PI) * 70; } });
  const ts = 150 * k, land = prog(lt, 2.26, 2.5);
  put(S2.tok, { x: pos[0] * k + 30 * k, y: (pos[1] - lift) * k, w: ts, h: ts, fs: ts * 0.62, s: 1 + 0.15 * Math.sin(land * Math.PI), o: eOut(prog(lt, 0.5, 0.8)) });
  const st = eElastic(prog(lt, 2.45, 3.1));
  put(S2.stamp, { x: 330 * k, y: 1110 * k, fs: 90 * k, s: st, r: -12, o: prog(lt, 2.45, 2.5) });
  const dk = prog(lt, 0.55, 0.95), dn = dk < 1 ? 1 + Math.floor(lt * 20) % 6 : 1;
  S2.dice.textContent = dk < 1 ? `🎲 ${dn} + ${1 + Math.floor(lt * 23 + 2) % 6}` : '🎲 1 + 2 = 3';
  put(S2.dice, { x: VIS.x + PW * 0.28, y: VIS.y - PH * 0.42 + float, fs: (LAND ? 4.2 : 5) * U, s: eBack(prog(lt, 0.45, 0.7)) * (1 + 0.1 * Math.sin(prog(lt, 0.95, 1.15) * Math.PI)), r: 5, o: lt > 0.45 ? V.o * (1 - prog(lt, 2.4, 2.6)) : 0 });
  put(S2.chips, { x: TXT.x, y: TXT.subY + (LAND ? 7.5 : 5.5) * U, fs: (LAND ? 3 : 3.6) * U, o: eOut(prog(lt, 1.1, 1.5)) * V.o });
  animHeadline(S2.h, t, T.board[0] + 0.25, TXT.y, TXT.fs, TXT.x, V.o);
  put(S2.s, { x: TXT.x, y: TXT.subY, fs: TXT.subFs, o: eOut(prog(lt, 0.7, 1.1)) * V.o, s: lerp(0.6, 1, eBack(prog(lt, 0.7, 1.1))) });
}

// ---------- scene 3: build ----------
const HOUSE = `<svg viewBox="0 0 20 20" width="100%" height="100%"><path d="M10 2 L19 9 L17 9 L17 18 L3 18 L3 9 L1 9 Z" fill="#1FA34A" stroke="#0b5a22" stroke-width="1.2" stroke-linejoin="round"/><rect x="8" y="12" width="4" height="6" fill="#0b5a22"/></svg>`;
const HOTEL = `<svg viewBox="0 0 30 24" width="100%" height="100%"><path d="M2 8 L15 1 L28 8 L28 23 L2 23 Z" fill="#E3001B" stroke="#7a000e" stroke-width="1.3" stroke-linejoin="round"/><g fill="#ffe9a8"><rect x="6" y="11" width="4" height="4"/><rect x="13" y="11" width="4" height="4"/><rect x="20" y="11" width="4" height="4"/><rect x="6" y="17" width="4" height="4"/><rect x="20" y="17" width="4" height="4"/></g><rect x="13" y="17" width="4" height="6" fill="#7a000e"/></svg>`;
const S3 = { tiles: [], houses: [], coins: [] };
(EN ? [['Ocean Drive', '$170', '#8e44ad'], ['Collins Avenue', '$170', '#8e44ad'], ['Lincoln Road', '$190', '#8e44ad']] : [['רח\' הרצל', '₪170', '#8e44ad'], ['שד\' בנימין', '₪170', '#8e44ad'], ['כיכר העצמאות', '₪190', '#8e44ad']]).forEach(([n, p, c]) => {
  S3.tiles.push(el('tile', stage, `<div class="hd" style="background:${c}"></div><div class="nm">${n}</div><div class="pr">${p}</div>`));
});
for (let i = 0; i < 6; i++) S3.houses.push(el('', stage, HOUSE));
S3.hotel = el('', stage, HOTEL); S3.puff = el('', stage, '💥');
S3.rent = el('badge c', stage, '<span dir="ltr" style="unicode-bidi:isolate">+' + CUR + '240</span> ' + L("שכר דירה", "rent")); S3.counter = el('counter'); S3.h = headline(L("בונים בתים ומלונות", "Build houses & hotels")); S3.s = el('sub', stage, L("וגובים שכר דירה", "and collect rent"));
{ const R = rng(23); for (let i = 0; i < 14; i++) S3.coins.push({ e: el('coin', stage, CUR), d: R() * 0.5, sx: R(), off: (R() - 0.5) }); }
function scene3(t) {

function background(t) {
  // hue drifts per scene
  const hues = [[46, 155, 255, 13, 79, 163], [255, 120, 70, 200, 30, 40], [70, 200, 110, 15, 110, 50], [40, 190, 200, 10, 90, 110], [255, 120, 160, 150, 20, 80], [130, 90, 255, 60, 25, 150], [90, 110, 130, 30, 40, 60], [46, 155, 255, 13, 79, 163], [255, 90, 170, 140, 20, 90], [255, 170, 40, 200, 80, 10], [46, 155, 255, 13, 79, 163]];
  const keys = Object.values(T); let i = keys.findIndex(([a, b]) => t >= a && t < b); if (i < 0) i = keys.length - 1;
  const k = eInOut(prog(t, keys[i][0] - 0.25, keys[i][0] + 0.35)), p = hues[Math.max(0, i - 1)], c = hues[i];
  const m = (j) => Math.round(lerp(i === 0 ? c[j] : p[j], c[j], k));
  stage.style.background = `radial-gradient(circle at 50% 40%, rgb(${m(0)},${m(1)},${m(2)}), rgb(${m(3)},${m(4)},${m(5)}) 72%, #061d40)`;
  const rs = Math.max(W, H) * 1.6;
  put(rays, { x: VIS.x, y: VIS.y, w: rs, h: rs, r: t * 12, o: 0.55 });
  bgCoins.forEach((c) => { const y = H + c.d - ((t * c.sp * H + c.ph * H) % (H + 2 * c.d)); put(c.e, { x: c.x + Math.sin(t + c.ph) * 3 * U, y, w: c.d, h: c.d, fs: c.d * 0.55, r: c.rot + t * 60, o: 0.28 }); });
  put(bandTop, { x: W / 2, y: 0.8 * U, w: W, o: 1 }); put(bandBot, { x: W / 2, y: H - 0.8 * U, w: W, o: 1 });
  // color-bar wipe at each cut
  const cuts = Object.values(T).slice(1).map(([a]) => a); const cut = cuts.find((c) => t > c - 0.45 && t < c + 0.45);
  if (cut != null) { const wk = prog(t, cut - 0.45, cut + 0.45), ww = Math.max(W, H) * 0.5; put(wipe, { x: lerp(W + ww * 1.5, -ww * 1.5, eInOut(wk)), y: CY, w: ww, h: Math.hypot(W, H) * 1.2, r: 18, o: 1 }); }
  else hide(wipe);
  // flash on the logo slam
