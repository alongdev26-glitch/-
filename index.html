<title>מגירת המילים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1c7c6f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מגירת המילים">
<style>
  :root{
    --bg:#f4f6f2;
    --surface:#ffffff;
    --surface-2:#eaeee4;
    --ink:#1c2a20;
    --ink-soft:#516152;
    --line:#cdd6c4;
    --accent:#1c7c6f;
    --accent-strong:#0f5c52;
    --accent-tint:#e3f0ea;
    --amber:#c97f2e;
    --amber-tint:#f7e9d6;
    --good:#2f8f5d;
    --good-tint:#e3f2e7;
    --bad:#b8483b;
    --bad-tint:#faeae7;
    --bg-top:#eef3ea;
    --dot:rgba(28,124,111,.10);
    --shadow: 0 1px 0 rgba(28,42,32,.06), 0 10px 24px -14px rgba(28,42,32,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101a14;
      --surface:#16211a;
      --surface-2:#1d2b21;
      --ink:#e9efe6;
      --ink-soft:#9db19f;
      --line:#2c3d31;
      --accent:#49d3bd;
      --accent-strong:#7ee8d5;
      --accent-tint:#1a3530;
      --amber:#e3a35c;
      --amber-tint:#2f2618;
      --good:#5cc98b;
      --good-tint:#173322;
      --bad:#e2837a;
      --bad-tint:#3a201d;
      --bg-top:#152218;
      --dot:rgba(73,211,189,.08);
      --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101a14;
    --surface:#16211a;
    --surface-2:#1d2b21;
    --ink:#e9efe6;
    --ink-soft:#9db19f;
    --line:#2c3d31;
    --accent:#49d3bd;
    --accent-strong:#7ee8d5;
    --accent-tint:#1a3530;
    --amber:#e3a35c;
    --amber-tint:#2f2618;
    --good:#5cc98b;
    --good-tint:#173322;
    --bad:#e2837a;
    --bad-tint:#3a201d;
    --bg-top:#152218;
    --dot:rgba(73,211,189,.08);
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(var(--dot) 1.4px, transparent 1.4px) 0 0/24px 24px,
      linear-gradient(180deg, var(--bg-top), var(--bg) 420px);
    color:var(--ink);
    font-family:'Assistant',system-ui,sans-serif;
  }
  .app{max-width:480px;width:100%;margin:0 auto;padding:0 16px;position:relative;}

  .topbar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 0 10px;
    background:linear-gradient(180deg, var(--bg-top), var(--bg-top) 75%, transparent);
    backdrop-filter:blur(6px);
  }
  .topbar-id{display:flex;align-items:center;gap:8px;}
  .topbar-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:9px;background:var(--accent-tint);font-size:16px;flex-shrink:0;
  }
  .topbar-title{font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:18px;}
  .topbar-streak{
    display:none;align-items:center;gap:4px;
    font:700 13px 'IBM Plex Mono',monospace;color:var(--amber);
    background:var(--amber-tint);padding:5px 10px;border-radius:999px;
  }

  .tabcontent{padding-bottom:16px;}

  .bottomnav{
    margin:24px -16px 0;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px -12px rgba(0,0,0,.25);
    z-index:10;
  }
  .navbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:none;cursor:pointer;
    padding:6px 2px;border-radius:12px;
    color:var(--ink-soft);
    transition:color .15s,background .15s;
  }
  .navbtn .navicon{font-size:19px;line-height:1;}
  .navbtn .navlabel{font:700 10.5px 'Assistant',sans-serif;}
  .navbtn.active{color:var(--accent-strong);background:var(--accent-tint);}

  /* --- chips --- */
  .row{display:flex;flex-wrap:wrap;gap:8px;}
  .chiprow{margin-bottom:10px;}
  .chip{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font:600 13.5px/1 'Assistant',sans-serif;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s,transform .1s;
  }
  .chip:hover{border-color:var(--accent);color:var(--ink);}
  .chip:active{transform:scale(.97);}
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .modes{margin-bottom:10px;}
  .modes .chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .diffs{margin-bottom:8px;}
  .diffs .chip.active{background:var(--amber);border-color:var(--amber);color:#fff;}
  .diffnote{color:var(--ink-soft);font-size:12px;margin:0 0 14px;}

  .timerset{margin-bottom:8px;}
  .timer-custom{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .timer-custom input[type=range]{flex:1;accent-color:var(--accent);}
  .timer-custom span{
    font:700 13px 'IBM Plex Mono',monospace;
    color:var(--accent-strong);
    min-width:70px;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }

  /* --- stat bar --- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:18px;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width:480px){ .stats{grid-template-columns:repeat(2,1fr);} }
  .stat{
    text-align:center;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 4px;
    box-shadow:var(--shadow);
    min-width:0;
  }
  .stat .n{font:700 19px 'IBM Plex Mono',monospace;color:var(--accent-strong);display:block;}
  .stat .l{font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em;}
</style>
<style>
  /* --- card --- */
  .stage{position:relative;min-height:300px;margin-bottom:18px;}
  .stage::before,
  .stage::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:18px;
    border:1px solid var(--line);
    z-index:0;
  }
  .stage::before{background:var(--surface-2);transform:rotate(-3deg) translateY(6px);}
  .stage::after{background:var(--surface);transform:rotate(2.5deg) translateY(4px);}
  .card{
    position:relative;
    z-index:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:30px 26px 26px;
    min-height:300px;
    display:flex;
    flex-direction:column;
  }
  .card::before{
    content:"";
    position:absolute;
    top:14px; right:50%;
    transform:translateX(50%);
    width:26px;height:9px;
    border-radius:999px;
    background:var(--bg);
    border:1px solid var(--line);
  }
  .card-head{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    margin-bottom:auto;
    padding-top:6px;
  }
  .pos-tag{
    font:700 11px/1 'Assistant',sans-serif;
    letter-spacing:.04em;
    color:var(--accent-strong);
    background:var(--accent-tint);
    padding:5px 10px;
    border-radius:7px;
  }
  .index{font:600 12px 'IBM Plex Mono',monospace;color:var(--ink-soft);}

  .card-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:28px 4px 20px;
    flex:1;
  }
  .word-en{
    direction:ltr;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:clamp(30px,7vw,42px);
    color:var(--ink);
    text-wrap:balance;
  }
  .word-he{
    font-family:'Frank Ruhl Libre',serif;
    font-weight:700;
    font-size:clamp(26px,6vw,36px);
    color:var(--ink);
  }
  .hint{color:var(--ink-soft);font-size:13px;}
  .hintcode{
    direction:ltr;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.2em;
    color:var(--ink-soft);
    font-size:15px;
  }
  .flip-rule{
    width:70%;
    height:1px;
    background:var(--line);
    margin:0 auto;
  }
  .diff-badge{
    font:700 10.5px 'Assistant',sans-serif;
    letter-spacing:.02em;
    padding:5px 9px;
    border-radius:7px;
  }
  .speak-row{display:flex;align-items:center;justify-content:center;gap:10px;}
  .speak-btn{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);
    display:inline-flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--accent-strong);
    flex-shrink:0;
  }
  .speak-btn:hover{border-color:var(--accent);background:var(--accent-tint);}
  .speak-btn:active{transform:scale(.92);}
  .phonetic{direction:ltr;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:14px;}

  /* flip animation */
  .flip-scene{width:100%;perspective:1200px;}
  .flip-card{
    position:relative;
    width:100%;
    min-height:190px;
    transform-style:preserve-3d;
  }
  .flip-card.no-anim{transition:none;}
  .flip-card.anim{transition:transform .55s cubic-bezier(.4,.15,.2,1);}
  .flip-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
  }
  .flip-face.back{transform:rotateY(180deg);}

  .card-actions{display:flex;justify-content:center;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .btn{
    font:700 14.5px 'Assistant',sans-serif;
    padding:11px 20px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    cursor:pointer;
    transition:transform .1s,background .15s,border-color .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:scale(.96);}
  .btn.small{padding:8px 14px;font-size:13px;}
  .btn.primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-strong));
    border-color:var(--accent-strong);
    color:#fff;
    box-shadow:0 8px 18px -10px var(--accent-strong);
  }
  .btn.primary:hover{background:linear-gradient(135deg, var(--accent-strong), var(--accent));}
  .btn.good{background:var(--good-tint);border-color:var(--good);color:var(--good);}
  .btn.bad{background:var(--bad-tint);border-color:var(--bad);color:var(--bad);}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:.5;cursor:default;}

  /* multiple choice */
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    width:100%;
    margin-top:4px;
  }
  @media (max-width:480px){ .options{grid-template-columns:1fr;} }
  .opt{
    font:600 16px 'Frank Ruhl Libre',serif;
    padding:14px 12px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    cursor:pointer;
    transition:transform .1s,border-color .15s,background .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 16px -10px rgba(28,42,32,.35);}
  .opt:active:not(:disabled){transform:scale(.98);}
  .opt.correct{background:var(--good-tint);border-color:var(--good);color:var(--good);}
  .opt.wrong{background:var(--bad-tint);border-color:var(--bad);color:var(--bad);}
  .opt:disabled{cursor:default;}

  /* typing */
  .typebox{
    display:flex;
    gap:8px;
    width:100%;
    max-width:360px;
    margin-top:4px;
  }
  #typeInput{
    direction:ltr;
    text-align:center;
    flex:1;
    font:600 18px 'IBM Plex Mono',monospace;
    padding:12px 14px;
    border-radius:11px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink);
  }
  #typeInput:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .feedback{font:600 15px 'Assistant',sans-serif;min-height:20px;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}

  /* translate swap bar */
  .translate-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px;}
  .lang-pill{
    font:700 12px 'Assistant',sans-serif;
    padding:6px 14px;
    border-radius:999px;
    background:var(--surface-2);
    color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .lang-pill.active{background:var(--accent-tint);color:var(--accent-strong);border-color:var(--accent);}
  .swap-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform .2s,border-color .15s,color .15s;
  }
  .swap-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
  .swap-btn:active{transform:rotate(180deg);}

  /* timer */
  .timerwrap{width:100%;}
  .timerbar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
  .timerbar > i{display:block;height:100%;background:var(--amber);transition:width .1s linear;}
  .timerlabel{font-size:11px;color:var(--ink-soft);margin-top:4px;}

  .progress{
    height:6px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress > i{
    display:block;height:100%;
    background:var(--accent);
    transition:width .25s;
  }

  .nudge-line{
    text-align:center;font-size:12px;color:var(--ink-soft);margin-top:10px;
    background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;
  }
  .nudge-line b{color:var(--accent-strong);}

  .focus-banner{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--amber-tint);border:1px solid var(--amber);color:var(--amber);
    border-radius:12px;padding:10px 14px;margin-bottom:14px;font:700 12.5px 'Assistant',sans-serif;
  }
  .focus-banner button{background:none;border:none;color:var(--amber);font-weight:700;cursor:pointer;text-decoration:underline;font-size:12px;}

  /* results screen */
  .results-flag{font:800 21px 'Frank Ruhl Libre',serif;color:var(--accent-strong);text-align:center;text-wrap:balance;}
  .results-points{
    font:800 48px 'IBM Plex Mono',monospace;
    color:var(--ink);
    line-height:1;
    animation:pop-in .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop-in{
    0%{transform:scale(.4);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }
  .confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:visible;}
  .confetti-piece{
    position:absolute;
    top:-10px;
    width:8px;height:14px;
    border-radius:2px;
    opacity:0;
    animation:confetti-fall 1.5s ease-in forwards;
  }
  @keyframes confetti-fall{
    0%{opacity:1;transform:translateY(0) rotate(0deg);}
    100%{opacity:0;transform:translateY(220px) rotate(360deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .results-points{animation:none;}
    .confetti-piece{display:none;}
  }
  .results-points span{font-size:20px;color:var(--ink-soft);font-family:'Assistant',sans-serif;font-weight:700;}
  .results-sub{font:600 14px 'Assistant',sans-serif;color:var(--ink-soft);}
  .results-best{font:700 13.5px 'Assistant',sans-serif;padding:6px 14px;border-radius:999px;}
  .results-meta{font:600 11.5px 'Assistant',sans-serif;color:var(--ink-soft);letter-spacing:.03em;margin-top:2px;}
  .results-footrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center;width:100%;}
  .results-footrow .btn{flex:1;min-width:150px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
<style>
  /* --- drawer tab --- */
  .drawer-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .summary-tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow);}
  .summary-tile .n{font:700 18px 'IBM Plex Mono',monospace;color:var(--accent-strong);display:block;}
  .summary-tile .l{font-size:10px;color:var(--ink-soft);}

  .search-wrap{position:relative;margin-bottom:10px;}
  .search-input{
    width:100%;
    font:600 14px 'Assistant',sans-serif;
    padding:11px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .drawer-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}

  .word-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .word-row{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    box-shadow:var(--shadow);
  }
  .word-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .word-row-icons{display:flex;gap:4px;}
  .icon-btn{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
  .icon-btn.star.active{background:var(--amber-tint);border-color:var(--amber);color:var(--amber);}
  .word-row-main{display:flex;align-items:baseline;gap:10px;}
  .word-row-en{direction:ltr;font:700 18px 'IBM Plex Mono',monospace;color:var(--ink);}
  .word-row-he{font:600 14px 'Frank Ruhl Libre',serif;color:var(--ink-soft);}
  .word-row-status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;}
  .status-pill{font:700 10.5px 'Assistant',sans-serif;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .status-pill.weak{background:var(--bad-tint);color:var(--bad);}
  .status-pill.mid{background:var(--amber-tint);color:var(--amber);}
  .status-pill.good{background:var(--good-tint);color:var(--good);}
  .status-pill.master{background:var(--accent-tint);color:var(--accent-strong);}
  .status-pill.muted{background:var(--surface-2);color:var(--ink-soft);}
  .mastery-track{flex:1;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
  .mastery-fill{display:block;height:100%;}
  .word-row-editinput{
    flex:1;font:600 14px 'Frank Ruhl Libre',serif;padding:7px 9px;border-radius:8px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  }

  .addword-card{background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;}
  .addword-row{display:flex;gap:8px;flex-wrap:wrap;}
  .addword-input,.addword-select{
    flex:1;min-width:110px;font:600 13.5px 'Assistant',sans-serif;padding:9px 10px;border-radius:9px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  }
  .addword-error{color:var(--bad);font-size:12px;}

  .focus-cta{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg, var(--amber), #a8651f);
    color:#fff;font:700 14px 'Assistant',sans-serif;
    padding:14px;border-radius:14px;border:none;cursor:pointer;width:100%;
    box-shadow:0 10px 20px -12px rgba(0,0,0,.4);
  }

<script>
(function(){
  "use strict";

  var BASE_WORDS = [
    {en:"blog", he:"בלוג", pos:"noun", cat:"nouns", ipa:"blɒg"},
    {en:"chance", he:"הזדמנות", pos:"noun", cat:"nouns", ipa:"tʃæns"},
    {en:"concert", he:"קונצרט", pos:"noun", cat:"nouns", ipa:"ˈkɑːnsɜːrt"},
    {en:"cooking", he:"בישול", pos:"noun", cat:"nouns", ipa:"ˈkʊkɪŋ"},
    {en:"cousin", he:"בן/בת דוד", pos:"noun", cat:"nouns", ipa:"ˈkʌzən"},
    {en:"discount", he:"הנחה", pos:"noun", cat:"nouns", ipa:"ˈdɪskaʊnt"},
    {en:"factory", he:"מפעל", pos:"noun", cat:"nouns", ipa:"ˈfæktəri"},
    {en:"festival", he:"פסטיבל", pos:"noun", cat:"nouns", ipa:"ˈfɛstəvəl"},
    {en:"taste", he:"טעם", pos:"noun", cat:"nouns", ipa:"teɪst"},
    {en:"variety", he:"גיוון / מבחר", pos:"noun", cat:"nouns", ipa:"vəˈraɪəti"},

    {en:"adjust", he:"להתאים", pos:"verb", cat:"verbs", ipa:"əˈdʒʌst"},
    {en:"create", he:"ליצור", pos:"verb", cat:"verbs", ipa:"kriˈeɪt"},
    {en:"develop", he:"לפתח", pos:"verb", cat:"verbs", ipa:"dɪˈvɛləp"},
    {en:"land", he:"לנחות", pos:"verb", cat:"verbs", ipa:"lænd"},
    {en:"last", he:"להימשך", pos:"verb", cat:"verbs", ipa:"læst"},

    {en:"amazing", he:"מדהים", pos:"adj", cat:"adj", ipa:"əˈmeɪzɪŋ"},
    {en:"crowded", he:"צפוף", pos:"adj", cat:"adj", ipa:"ˈkraʊdɪd"},
    {en:"delicious", he:"טעים", pos:"adj", cat:"adj", ipa:"dɪˈlɪʃəs"},
    {en:"exciting", he:"מרגש", pos:"adj", cat:"adj", ipa:"ɪkˈsaɪtɪŋ"},
    {en:"illegal", he:"לא חוקי", pos:"adj", cat:"adj", ipa:"ɪˈliːgəl"},
    {en:"northern", he:"צפוני", pos:"adj", cat:"adj", ipa:"ˈnɔːrðərn"},
    {en:"traditional", he:"מסורתי", pos:"adj", cat:"adj", ipa:"trəˈdɪʃənəl"},
    {en:"unpleasant", he:"לא נעים", pos:"adj", cat:"adj", ipa:"ʌnˈplɛzənt"},
    {en:"upset", he:"מוטרד / עצוב", pos:"adj", cat:"adj", ipa:"ʌpˈsɛt"},

    {en:"downtown", he:"מרכז העיר", pos:"other", cat:"other", ipa:"ˌdaʊnˈtaʊn"},
    {en:"for sale", he:"למכירה", pos:"other", cat:"other", ipa:"fər seɪl"},
    {en:"part of", he:"חלק מ-", pos:"other", cat:"other", ipa:"pɑːrt əv"},
    {en:"take it easy", he:"להירגע / לקחת בקלות", pos:"other", cat:"other", ipa:"teɪk ɪt ˈiːzi"}
  ];

  var CATS = [
    {key:"all", label:"כל המילים"},
    {key:"nouns", label:"שמות עצם"},
    {key:"verbs", label:"פעלים"},
    {key:"adj", label:"שמות תואר"},
    {key:"other", label:"אחר"}
  ];
  var POS_LABEL = {noun:"שם עצם", verb:"פועל", adj:"תואר", other:"אחר"};
  var CAT_TO_POS = {nouns:"noun", verbs:"verb", adj:"adj", other:"other"};

  var MODES = [
    {key:"flash", label:"כרטיסיות"},
    {key:"mc", label:"בחירה מרובה"},
    {key:"type", label:"הקלדה"}
  ];

  var DIFFS = [
    {key:"easy", label:"קל", options:3, timer:0, points:10, roundSize:8, typeHint:"first",
      color:"var(--good)", tint:"var(--good-tint)",
      note:"3 אפשרויות, בלי שעון, רמז לאות ראשונה בהקלדה, סיבוב של 8 שאלות."},
    {key:"medium", label:"בינוני", options:4, timer:15, points:20, roundSize:10, typeHint:"length",
      color:"var(--amber)", tint:"var(--amber-tint)",
      note:"4 אפשרויות, 15 שניות לתשובה, רק אורך המילה מוצג בהקלדה, סיבוב של 10 שאלות."},
    {key:"hard", label:"קשה", options:6, timer:8, points:35, roundSize:12, typeHint:"none",
      color:"var(--bad)", tint:"var(--bad-tint)",
      note:"6 אפשרויות, 8 שניות לתשובה, בלי שום רמז בהקלדה, סיבוב של 12 שאלות."}
  ];
  function diffCfg(){
    for(var i=0;i<DIFFS.length;i++){ if(DIFFS[i].key===state.diff) return DIFFS[i]; }
    return DIFFS[1];
  }

  var state = {
    tab:"practice",
    cat:"all",
    mode:"flash",
    diff:"medium",
    queue:[],
    pos:0,
    flipped:false,
    justFlipped:false,
    finished:false,
    isNewBest:false,
    timerId:null,
    typeDir:"he2en",
    timerMode:"auto",
    customSeconds:20,
    focusMode:false,
    flashHintShown:false,
    mcHintUsed:false,
    typeHintBoost:false,
    drawerCat:"all",
    drawerSearch:"",
    drawerEditing:false,
    showAddWord:false,
    roundStartTime:null,
    session:{correct:0,total:0,streak:0,points:0}
  };

  function effectiveTimerSeconds(cfg){
    if(state.timerMode==="off") return 0;
    if(state.timerMode==="custom") return state.customSeconds;
    return cfg.timer;
  }

  function currentKey(){ return (state.focusMode?"focus":state.cat) + "|" + state.mode + "|" + state.diff; }
  function catLabel(key){
    if(key==="focus") return "תרגול ממוקד";
    for(var i=0;i<CATS.length;i++){ if(CATS[i].key===key) return CATS[i].label; }
    return key;
  }
  function modeLabel(key){ for(var i=0;i<MODES.length;i++){ if(MODES[i].key===key) return MODES[i].label; } return key; }

  var STORE_KEY = "word-drawer-stats-v2";
  function loadStore(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      var parsed = raw ? (JSON.parse(raw)||{}) : {};
      return {
        overrides: (parsed.overrides && typeof parsed.overrides==="object") ? parsed.overrides : {},
        bestByKey: (parsed.bestByKey && typeof parsed.bestByKey==="object") ? parsed.bestByKey : {},
        customWords: Array.isArray(parsed.customWords) ? parsed.customWords : [],
        favorites: (parsed.favorites && typeof parsed.favorites==="object") ? parsed.favorites : {},
        wordStats: (parsed.wordStats && typeof parsed.wordStats==="object") ? parsed.wordStats : {},
        xpTotal: typeof parsed.xpTotal==="number" ? parsed.xpTotal : 0,
        streak: (parsed.streak && typeof parsed.streak==="object") ? parsed.streak : {count:0,lastDate:""},
        practiceDates: Array.isArray(parsed.practiceDates) ? parsed.practiceDates : [],
        dailyGoal: (parsed.dailyGoal && typeof parsed.dailyGoal==="object") ? parsed.dailyGoal : {date:"",words:[]},
        practiceSeconds: typeof parsed.practiceSeconds==="number" ? parsed.practiceSeconds : 0,
        profile: (parsed.profile && typeof parsed.profile==="object") ? parsed.profile : {name:""},
        totalCorrectEver: typeof parsed.totalCorrectEver==="number" ? parsed.totalCorrectEver : 0,
        totalAttemptsEver: typeof parsed.totalAttemptsEver==="number" ? parsed.totalAttemptsEver : 0,
        roundsCompleted: typeof parsed.roundsCompleted==="number" ? parsed.roundsCompleted : 0,
        perfectRounds: typeof parsed.perfectRounds==="number" ? parsed.perfectRounds : 0
      };
    }catch(e){
      return {overrides:{}, bestByKey:{}, customWords:[], favorites:{}, wordStats:{}, xpTotal:0,
        streak:{count:0,lastDate:""}, practiceDates:[], dailyGoal:{date:"",words:[]}, practiceSeconds:0,
        profile:{name:""}, totalCorrectEver:0, totalAttemptsEver:0, roundsCompleted:0, perfectRounds:0};
    }
  }
  function saveStore(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  }
  var store = loadStore();

  function allBaseWords(){ return BASE_WORDS.concat(store.customWords); }

  function buildActiveWords(){
    return allBaseWords().map(function(w){
      var isCustomWord = store.customWords.indexOf(w) !== -1;
      var override = store.overrides[w.en];
      var he = (!isCustomWord && override && override.trim()) ? override.trim() : w.he;
      return { en:w.en, he:he, pos:w.pos, cat:w.cat, ipa:w.ipa };
    });
  }
  var WORDS = buildActiveWords();

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text!=null) e.textContent = text;
    return e;
  }

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  function statusOf(en){
    var s = store.wordStats[en] || {attempts:0,correct:0};
    if(s.attempts===0) return {cls:"muted", label:"לתרגול", pct:0};
    var pct = Math.round((s.correct/s.attempts)*100);
    if(pct>=95 && s.attempts>=3) return {cls:"master", label:"הושלם (מאסטר)", pct:pct};
    if(pct>=80) return {cls:"good", label:"שליטה מצוינת", pct:pct};
    if(pct>=50) return {cls:"mid", label:"בהתקדמות", pct:pct};
    return {cls:"weak", label:"דורש חיזוק", pct:pct};
  }
  function statusColor(cls){
    return cls==="weak" ? "var(--bad)" : cls==="mid" ? "var(--amber)" : cls==="good" ? "var(--good)" : cls==="master" ? "var(--accent)" : "var(--line)";
  }

  function registerDailyWord(en){
    var today = todayStr();
    if(!store.dailyGoal || store.dailyGoal.date !== today){
      store.dailyGoal = {date:today, words:[]};
    }
    if(store.dailyGoal.words.indexOf(en)===-1) store.dailyGoal.words.push(en);
  }
  function registerDailyActivity(){
    var today = todayStr();
    if(store.practiceDates.indexOf(today)===-1){
      store.practiceDates.push(today);
      if(store.practiceDates.length>60) store.practiceDates.shift();
    }
    var y = new Date(); y.setDate(y.getDate()-1);
    var yStr = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    if(store.streak.lastDate === today){ /* already counted today */ }
    else if(store.streak.lastDate === yStr){ store.streak.count++; store.streak.lastDate = today; }
    else { store.streak.count = 1; store.streak.lastDate = today; }
  }

  function updateWordStats(en, correct){
    if(!store.wordStats[en]) store.wordStats[en] = {attempts:0, correct:0};
    store.wordStats[en].attempts++;
    if(correct) store.wordStats[en].correct++;
    store.totalAttemptsEver++;
    if(correct){
      store.totalCorrectEver++;
      store.xpTotal += diffCfg().points;
    }
    registerDailyWord(en);
    saveStore();
  }

  function wordsForCat(cat){
    if(cat==="all") return WORDS;
    return WORDS.filter(function(w){ return w.cat===cat; });
  }

  function resetPerQuestionUI(){
    state.flashHintShown = false;
    state.mcHintUsed = false;
    state.typeHintBoost = false;
  }

  function buildQueue(){
    var size = diffCfg().roundSize;
    var pool = wordsForCat(state.cat);
    var q = [];
    while(q.length < size){ q = q.concat(shuffle(pool)); }
    state.queue = q.slice(0, size);
    state.pos = 0;
    state.flipped = false;
    state.roundStartTime = Date.now();
    resetPerQuestionUI();
  }

  function current(){ return state.queue[state.pos]; }

  function clearTimer(){
    if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
  }

  function resetSession(){
    state.session = {correct:0,total:0,streak:0,points:0};
    state.finished = false;
  }

  function finishRound(){
    clearTimer();
    var key = currentKey();
    var prevBest = store.bestByKey[key] || 0;
    state.isNewBest = state.session.points > prevBest;
    if(state.isNewBest) store.bestByKey[key] = state.session.points;
    store.roundsCompleted++;
    if(state.session.total>0 && state.session.correct===state.session.total) store.perfectRounds++;
    if(state.roundStartTime){
      store.practiceSeconds += Math.round((Date.now()-state.roundStartTime)/1000);
    }
    registerDailyActivity();
    saveStore();
    state.finished = true;
    renderQuiz();
  }

  function advance(){
    state.pos++;
    if(state.pos >= state.queue.length){
      finishRound();
      return;
    }
    state.flipped = false;
    resetPerQuestionUI();
    renderQuiz();
  }

  function registerAnswer(correct){
    var w = current();
    state.session.total++;
    if(correct){
      state.session.correct++;
      state.session.streak++;
      state.session.points += diffCfg().points;
    } else {
      state.session.streak = 0;
    }
    updateWordStats(w.en, correct);
    renderStats();
  }

  function renderStats(){
    var pEl = document.getElementById("statPoints");
    if(!pEl) return;
    pEl.textContent = state.session.points;
    document.getElementById("statScore").textContent = state.session.correct + "/" + state.session.total;
    document.getElementById("statStreak").textContent = state.session.streak;
    document.getElementById("statBest").textContent = store.bestByKey[currentKey()] || 0;
    var pct = state.queue.length ? Math.round(((state.pos)/state.queue.length)*100) : 0;
    document.getElementById("progressBar").style.width = Math.min(pct,100) + "%";
  }

  function setChromeVisible(visible){
    document.getElementById("statsBar").style.display = visible ? "grid" : "none";
    document.getElementById("progressWrap").style.display = visible ? "block" : "none";
  }

  var ACHIEVEMENTS = [
    {key:"first_round", icon:"🎯", title:"צעד ראשון", desc:"להשלים סיבוב תרגול אחד", unit:"סיבובים",
      have:function(){ return Math.min(store.roundsCompleted,1); }, total:1},
    {key:"streak7", icon:"🔥", title:"שבוע מושלם", desc:"רצף למידה של 7 ימים", unit:"ימי רצף",
      have:function(){ return Math.min(store.streak.count,7); }, total:7},
    {key:"correct25", icon:"📖", title:"חוקר מילים", desc:"לענות נכון 25 פעמים", unit:"תשובות נכונות",
      have:function(){ return Math.min(store.totalCorrectEver,25); }, total:25},
    {key:"perfect", icon:"💯", title:"דיוק מושלם", desc:"לסיים סיבוב עם 100% דיוק", unit:"סיבובים מושלמים",
      have:function(){ return Math.min(store.perfectRounds,1); }, total:1},
    {key:"correct100", icon:"⭐", title:"אלוף/ת המילים", desc:"לענות נכון 100 פעמים בסך הכל", unit:"תשובות נכונות",
      have:function(){ return Math.min(store.totalCorrectEver,100); }, total:100},
    {key:"mastery_all", icon:"🏆", title:"שליטה מלאה", desc:"כל המילים ברמת שליטה מצוינת ומעלה", unit:"מילים",
      have:function(){
        var count=0;
        allBaseWords().forEach(function(w){ var s=statusOf(w.en); if(s.cls==="good"||s.cls==="master") count++; });
        return count;
      }, total:function(){ return allBaseWords().length; }}
  ];
  function achievementsList(){
    return ACHIEVEMENTS.map(function(a){
      var have = a.have();
      var total = typeof a.total==="function" ? a.total() : a.total;
      return {key:a.key, icon:a.icon, title:a.title, desc:a.desc, unit:a.unit, have:have, total:total, unlocked: have>=total};
    });
  }
  function nextAchievementProgress(){
    var list = achievementsList().filter(function(a){ return !a.unlocked; });
    if(!list.length) return null;
    list.sort(function(a,b){ return (a.total-a.have)-(b.total-b.have); });
    var top = list[0];
    return {icon:top.icon, title:top.title, remaining: top.total-top.have, unit:top.unit};
  }
  function renderNudge(){
    var box = document.getElementById("nudgeLine");
    if(!box) return;
    var next = nextAchievementProgress();
    if(!next){ box.style.display="none"; return; }
    box.style.display="block";
    box.textContent = next.icon + " עוד " + next.remaining + " " + next.unit + " לפתיחת התג ‘" + next.title + "’";
  }

  function statTile(id, val, label){
    var stat = el("div","stat");
    var n = el("span","n", val); n.id=id;
    var l = el("span","l", label);
    stat.appendChild(n); stat.appendChild(l);
    return stat;
  }

  function buildPracticeSkeleton(container){

    state.timerId = setInterval(function(){
      remaining -= 0.1;
      var pct = Math.max(0, (remaining/seconds)*100);

      if(remaining<=0){
        clearTimer();
        onExpire();
      }
    }, 100);
    return wrap;
  }

  function buildHint(text, level){
    if(level==="none") return "";
    return text.split("").map(function(ch, idx){
      if(ch===" ") return "  ";
      if(level==="first" && (idx===0 || text[idx-1]===" ")) return ch;
      return "_";
    }).join(" ");
  }

  function normalizeHe(s){
    return s.normalize("NFKC").replace(/["'׳״]/g,"").replace(/\s+/g," ").trim().toLowerCase();
  }

  function heAnswersFor(text){
    text = text.trim();
    if(text.indexOf(" / ") !== -1){
      return text.split(" / ").map(function(s){ return s.trim(); }).filter(Boolean);
    }
    if(text.indexOf("/") !== -1){
      var idx = text.indexOf("/");
      var left = text.slice(0, idx).trim();
      var rightPart = text.slice(idx+1).trim();
      var spaceIdx = rightPart.indexOf(" ");
      if(spaceIdx > -1){
        var sharedSuffix = rightPart.slice(spaceIdx);
        return [(left + sharedSuffix).trim(), rightPart.trim()];
      }
      return [left, rightPart];
    }
    return [text.replace(/[-־]\s*$/,"").trim()];
  }

    var editBtn = el("button","icon-btn","✎");
    editBtn.type="button"; editBtn.title="ערוך פירוש";
    editBtn.addEventListener("click", function(){
      state.drawerEditing = true;
      render();
    });
    var starBtn = el("button","icon-btn star"+(store.favorites[w.en]?" active":""),"★");
    starBtn.type="button"; starBtn.title="מועדף";
    starBtn.addEventListener("click", function(){
      store.favorites[w.en] = !store.favorites[w.en];
      saveStore();
      renderDrawerList();
    });
    var speakBtn = el("button","icon-btn","🔊");
    speakBtn.type="button"; speakBtn.title="השמעה";
    speakBtn.addEventListener("click", function(){ speak(w.en); });
    icons.appendChild(editBtn); icons.appendChild(starBtn); icons.appendChild(speakBtn);
    if(w.isCustom){
      var delBtn = el("button","icon-btn","🗑");
      delBtn.type="button"; delBtn.title="מחק מילה";
      delBtn.addEventListener("click", function(){
        store.customWords = store.customWords.filter(function(cw){ return cw.en!==w.en; });
        delete store.wordStats[w.en];
        delete store.favorites[w.en];
        saveStore();
        WORDS = buildActiveWords();
        renderDrawerList();
      });
      icons.appendChild(delBtn);
    }
    top.appendChild(icons);
    row.appendChild(top);

    if(state.drawerEditing){
      var editRow = el("div"); editRow.style.display="flex"; editRow.style.gap="8px"; editRow.style.alignItems="center";
      var input = document.createElement("input");
      input.type="text"; input.className="word-row-editinput";
      input.value = w.he;
      input.addEventListener("change", function(){
        var val = input.value.trim();
        if(w.isCustom){
          var cw = store.customWords.filter(function(c){ return c.en===w.en; })[0];
          if(cw) cw.he = val || cw.he;
        } else {
          if(!val || val===w.baseHe){ delete store.overrides[w.en]; input.value = w.baseHe; }
          else { store.overrides[w.en] = val; }
        }
        saveStore();
        WORDS = buildActiveWords();
      });
      editRow.appendChild(input);
      row.appendChild(editRow);
    } else {
      row.appendChild(el("div","word-row-he", w.he));
    }

    var status = statusOf(w.en);
    var statusRow = el("div","word-row-status");
    var pill = el("span","status-pill "+status.cls, status.label + (status.pct?(" · "+status.pct+"%"):""));
    var track = el("div","mastery-track");
    var fill = el("i","mastery-fill");
    fill.style.width = status.pct + "%";
    fill.style.background = statusColor(status.cls);
    track.appendChild(fill);
    statusRow.appendChild(track);
    statusRow.appendChild(pill);
    row.appendChild(statusRow);

    return row;
  }

  function renderDrawerList(){
    var listWrap = document.getElementById("wordList");
    if(!listWrap) return;
    listWrap.innerHTML = "";
    var words = drawerWordList();
    var q = state.drawerSearch.trim().toLowerCase();
    var qHe = state.drawerSearch.trim();
    var filtered = words.filter(function(w){
      if(state.drawerCat!=="all" && w.cat!==state.drawerCat) return false;
      if(q && w.en.toLowerCase().indexOf(q)===-1 && w.he.indexOf(qHe)===-1) return false;
      return true;
    });
    if(!filtered.length){
      listWrap.appendChild(el("div","nudge-line","לא נמצאו מילים תואמות."));
      listWrap.lastChild.style.display="block";
      return;
    }
    filtered.forEach(function(w){ listWrap.appendChild(renderWordRow(w)); });
  }

  function buildAddWordForm(){
    var card = el("div","addword-card");
    var row1 = el("div","addword-row");
    var enInput = document.createElement("input");
    enInput.className="addword-input"; enInput.placeholder="מילה באנגלית"; enInput.setAttribute("dir","ltr");
    var heInput = document.createElement("input");
    heInput.className="addword-input"; heInput.placeholder="פירוש בעברית";
    row1.appendChild(enInput); row1.appendChild(heInput);

    var row2 = el("div","addword-row");
    var catSelect = document.createElement("select"); catSelect.className="addword-select";
    CATS.slice(1).forEach(function(c){
      var opt = document.createElement("option"); opt.value=c.key; opt.textContent=c.label;
      catSelect.appendChild(opt);
    });
    var saveBtn = el("button","btn primary","הוסף מילה");
    saveBtn.type="button";
    row2.appendChild(catSelect); row2.appendChild(saveBtn);

    var errorLine = el("div","addword-error","");

    saveBtn.addEventListener("click", function(){
      var enVal = enInput.value.trim();
      var heVal = heInput.value.trim();
      if(!enVal || !heVal){ errorLine.textContent="צריך למלא גם את המילה באנגלית וגם את הפירוש."; return; }
      var exists = allBaseWords().some(function(w){ return w.en.toLowerCase()===enVal.toLowerCase(); });
      if(exists){ errorLine.textContent="המילה הזו כבר קיימת ברשימה."; return; }
      var cat = catSelect.value;
      store.customWords.push({en:enVal, he:heVal, pos:CAT_TO_POS[cat], cat:cat});
      saveStore();
      WORDS = buildActiveWords();
      state.showAddWord = false;
      render();
    });

    card.appendChild(row1); card.appendChild(row2); card.appendChild(errorLine);
    return card;
  }

  function renderDrawerTab(container){
    var words = drawerWordList();
    var counts = {all:words.length, nouns:0, verbs:0, adj:0, other:0};
    words.forEach(function(w){ counts[w.cat] = (counts[w.cat]||0)+1; });
    var attempted = words.filter(function(w){ return (store.wordStats[w.en]||{}).attempts>0; });
    var avgMastery = 0;
    if(attempted.length){
      var sum=0; attempted.forEach(function(w){ sum+=statusOf(w.en).pct; });
      avgMastery = Math.round(sum/attempted.length);
    }
    var weakList = words.filter(function(w){ var s=statusOf(w.en); return s.cls==="weak" || s.cls==="muted"; });

    var summary = el("div","drawer-summary");
    summary.appendChild(summaryTile(avgMastery+"%","שליטה ממוצעת"));
    summary.appendChild(summaryTile(String(weakList.length),"לחיזוק"));
    summary.appendChild(summaryTile(String(words.length),"סך מילים"));
    container.appendChild(summary);

    var searchWrap = el("div","search-wrap");
    var searchInput = document.createElement("input");
    searchInput.type="text"; searchInput.className="search-input";
    searchInput.placeholder = "חיפוש מילה באנגלית או בעברית...";
    searchInput.value = state.drawerSearch;
    searchInput.addEventListener("input", function(){
      state.drawerSearch = searchInput.value;
      renderDrawerList();
    });
    searchWrap.appendChild(searchInput);
    container.appendChild(searchWrap);

    var toolbar = el("div","drawer-toolbar");
    var editToggle = el("button","chip"+(state.drawerEditing?" active":""),"✎ עריכת פירושים");
    editToggle.type="button";
    editToggle.addEventListener("click", function(){ state.drawerEditing = !state.drawerEditing; render(); });
    var addToggle = el("button","chip"+(state.showAddWord?" active":""),"+ הוסף מילה חדשה");
    addToggle.type="button";
    addToggle.addEventListener("click", function(){ state.showAddWord = !state.showAddWord; render(); });
    toolbar.appendChild(editToggle); toolbar.appendChild(addToggle);
    container.appendChild(toolbar);

    if(state.showAddWord) container.appendChild(buildAddWordForm());

    var catChipRow = el("div","row chiprow");
    CATS.forEach(function(c){
      var chip = el("button","chip"+(state.drawerCat===c.key?" active":""), c.label + " " + (counts[c.key]||0));
      chip.type="button";
      chip.addEventListener("click", function(){ state.drawerCat = c.key; render(); });
      catChipRow.appendChild(chip);
    });
    container.appendChild(catChipRow);

    var listWrap = el("div","word-list"); listWrap.id="wordList";
    container.appendChild(listWrap);
    renderDrawerList();

    if(weakList.length){
      var cta = el("button","focus-cta","▶ התחל תרגול ממוקד — " + weakList.length + " מילים לחיזוק ושיפור הזיכרון");
      cta.type="button";
      cta.addEventListener("click", function(){ startFocusedPractice(weakList); });
      container.appendChild(cta);
    } else {
      var doneMsg = el("div","nudge-line","🎉 כל הכבוד! כרגע אין מילים שדורשות חיזוק מיוחד.");
      doneMsg.style.display="block";
      container.appendChild(doneMsg);
    }
  }

  function renderChallengesTab(container){
    container.appendChild(el("div","section-title","ההישגים שלך"));
    var grid = el("div","badge-grid");
    achievementsList().forEach(function(a){
      var card = el("div","badge-card"+(a.unlocked?" unlocked":""));
      var icon = el("div","badge-icon", a.icon);
      var body = el("div","badge-body");
      body.appendChild(el("div","badge-title", a.title));
      body.appendChild(el("div","badge-desc", a.desc));
      var track = el("div","badge-track");
      var fill = el("i","badge-fill");
      fill.style.width = Math.min(100, Math.round((a.have/a.total)*100)) + "%";
      track.appendChild(fill);
      body.appendChild(track);
      body.appendChild(el("div","badge-progress-label", a.have + " / " + a.total));
      card.appendChild(icon); card.appendChild(body);
      if(a.unlocked) card.appendChild(el("div","badge-check","✓"));
      grid.appendChild(card);
    });
    container.appendChild(grid);
  }

  function levelInfo(){
    var xp = store.xpTotal;
    var perLevel = 300;
    var level = Math.floor(xp/perLevel)+1;
    var into = xp % perLevel;
    var tiers = [
      {max:2, t:"טירון/ית מילים"},
      {max:5, t:"לומד/ת מתקדם/ת"},
      {max:9, t:"מומחה/ית אוצר מילים"},
      {max:Infinity, t:"אלוף/ת אוצר המילים"}
    ];
    var title = tiers[tiers.length-1].t;
    for(var i=0;i<tiers.length;i++){ if(level<=tiers[i].max){ title=tiers[i].t; break; } }
    return {level:level, title:title, into:into, perLevel:perLevel, xp:xp};
  }

  var deferredInstallPrompt = null;
  function wireInstallButton(){
    var btn = document.getElementById("installBtn");
    if(!btn) return;
    if(deferredInstallPrompt) btn.style.display = "inline-flex";
    btn.addEventListener("click", function(){
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(function(){
        deferredInstallPrompt = null;
        btn.style.display = "none";
      });
    });
  }

  function renderProfileTab(container){
    var li = levelInfo();
    var headCard = el("div","profile-card");
    var head = el("div","profile-head");
    var name = store.profile.name || "הלומד/ת שלי";
    var avatar = el("div","avatar", name.trim().charAt(0) || "📇");
    var nameWrap = el("div"); nameWrap.style.flex="1";
    var nameInput = document.createElement("input");
    nameInput.className="profile-name-input"; nameInput.value = name;
    nameInput.addEventListener("change", function(){
      store.profile.name = nameInput.value.trim() || "הלומד/ת שלי";
      saveStore();
      avatar.textContent = store.profile.name.charAt(0);
    });
    var levelPill = el("div","level-pill","⭐ " + li.title + " (רמה " + li.level + ")");
    nameWrap.appendChild(nameInput); nameWrap.appendChild(levelPill);
    head.appendChild(avatar); head.appendChild(nameWrap);
    headCard.appendChild(head);

    var xpRow = el("div","xp-row");
    xpRow.appendChild(el("span",null, li.into + " / " + li.perLevel + " XP"));
    xpRow.appendChild(el("span",null, "סה\"כ " + li.xp + " XP"));
    headCard.appendChild(xpRow);
    var xpTrack = el("div","xp-track");
    var xpFill = el("i","xp-fill"); xpFill.style.width = Math.round((li.into/li.perLevel)*100)+"%";
    xpTrack.appendChild(xpFill);
    headCard.appendChild(xpTrack);
    container.appendChild(headCard);

    var streakCard = el("div","profile-card");
    streakCard.appendChild(el("div","section-title","רצף למידה"));
    var streakRow = el("div","streak-row");
    streakRow.appendChild(el("div","streak-flame","🔥"));
    streakRow.appendChild(el("div","streak-count", store.streak.count + " ימים ברצף"));
    streakCard.appendChild(streakRow);
    var strip = el("div","streak-strip");
    var todayD = new Date();
    var dayLetters = ["א","ב","ג","ד","ה","ו","ש"];
    for(var i=6;i>=0;i--){
      var d = new Date(); d.setDate(todayD.getDate()-i);
      var dStr = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      var done = store.practiceDates.indexOf(dStr) !== -1;
      var isToday = i===0;
      var dayEl = el("div","streak-day"+(done?" done":"")+(isToday?" today":""), done?"✓":dayLetters[d.getDay()]);
      strip.appendChild(dayEl);
    }
    streakCard.appendChild(strip);
    container.appendChild(streakCard);

    var goalCard = el("div","profile-card");
    goalCard.appendChild(el("div","section-title","יעד יומי"));
    var todayWords = (store.dailyGoal.date===todayStr()) ? store.dailyGoal.words.length : 0;
    var target = 10;
    var goalRow = el("div","goal-row");
    goalRow.appendChild(el("span",null, todayWords + " / " + target + " מילים היום"));
    goalRow.appendChild(el("span",null, todayWords>=target ? "✅ הושלם!" : ""));
    goalCard.appendChild(goalRow);
    var goalTrack = el("div","goal-track");
    var goalFill = el("i","goal-fill"); goalFill.style.width = Math.min(100, Math.round((todayWords/target)*100))+"%";
    goalTrack.appendChild(goalFill);
    goalCard.appendChild(goalTrack);
    container.appendChild(goalCard);

    var words = drawerWordList();
    var learned = words.filter(function(w){ return (store.wordStats[w.en]||{}).attempts>0; }).length;
    var hours = store.practiceSeconds/3600;
    var timeLabel = hours>=1 ? (hours.toFixed(1)+" שעות") : (Math.round(store.practiceSeconds/60)+" דקות");
    var accAll = store.totalAttemptsEver ? Math.round((store.totalCorrectEver/store.totalAttemptsEver)*100) : 0;

    var statsCard = el("div","profile-card");
    statsCard.appendChild(el("div","section-title","מדדי הצלחה"));
    var mini = el("div","mini-stats");
    mini.appendChild(summaryTile(learned+"/"+words.length, "מילים תורגלו"));
    mini.appendChild(summaryTile(timeLabel, "זמן תרגול כולל"));
    mini.appendChild(summaryTile(accAll+"%", "דיוק כללי"));
    mini.appendChild(summaryTile(store.roundsCompleted+"", "סיבובים הושלמו"));
    statsCard.appendChild(mini);
    container.appendChild(statsCard);

    var weak = words.filter(function(w){ return (store.wordStats[w.en]||{}).attempts>0; })
      .map(function(w){ return {w:w, pct: statusOf(w.en).pct}; })
      .sort(function(a,b){ return a.pct-b.pct; })
      .slice(0,3)
      .filter(function(item){ return item.pct<80; });
    if(weak.length){
      var weakCard = el("div","profile-card");
      weakCard.appendChild(el("div","section-title","מילים הדורשות חיזוק"));
      weak.forEach(function(item){
        var row = el("div","weak-item");
        row.appendChild(el("span",null, item.w.en + " — " + item.w.he));
        row.appendChild(el("span",null, item.pct + "%"));
        weakCard.appendChild(row);
      });
      var practiceBtn = el("button","btn primary","תרגל עכשיו (" + weak.length + " מילים)");
      practiceBtn.type="button";
      practiceBtn.style.width="100%"; practiceBtn.style.marginTop="10px";
      practiceBtn.addEventListener("click", function(){ startFocusedPractice(weak.map(function(x){return x.w;})); });
      weakCard.appendChild(practiceBtn);
      container.appendChild(weakCard);
    }

    var installCard = el("div","profile-card");
    installCard.appendChild(el("div","section-title","📲 להתקין כאפליקציה בטלפון"));
    var installBtn = el("button","btn primary","📲 התקן כאפליקציה");
    installBtn.type="button"; installBtn.id="installBtn"; installBtn.style.display="none"; installBtn.style.marginBottom="10px";
    installCard.appendChild(installBtn);
    var details = document.createElement("details"); details.className="installbox-help";
    var summaryEl = document.createElement("summary"); summaryEl.textContent="הכפתור לא מופיע? הוסיפו למסך הבית ידנית";
    details.appendChild(summaryEl);
    var p1 = document.createElement("p"); p1.innerHTML = "<b>באייפון (Safari):</b> לוחצים על כפתור השיתוף ⬆️ בסרגל התחתון, גוללים ובוחרים ב\"הוסף למסך הבית\".";
    var p2 = document.createElement("p"); p2.innerHTML = "<b>באנדרואיד (Chrome):</b> לוחצים על שלוש הנקודות ⋮ בפינה הימנית העליונה, ובוחרים \"הוסף למסך הבית\" או \"התקן אפליקציה\".";
    details.appendChild(p1); details.appendChild(p2);
    installCard.appendChild(details);
    container.appendChild(installCard);
    wireInstallButton();
  }

  var NAV = [
    {key:"practice", label:"תרגול", icon:"📖"},
    {key:"drawer", label:"מגירה", icon:"🗂️"},
    {key:"challenges", label:"אתגרים", icon:"🏆"},
    {key:"profile", label:"פרופיל", icon:"👤"}
  ];
  function renderNav(){
    var nav = document.getElementById("bottomNav");
    nav.innerHTML = "";
    NAV.forEach(function(t){
      var btn = el("button","navbtn"+(state.tab===t.key?" active":""));
      btn.type="button";
      btn.appendChild(el("div","navicon", t.icon));
      btn.appendChild(el("div","navlabel", t.label));
      btn.addEventListener("click", function(){ switchTab(t.key); });
      nav.appendChild(btn);
    });
  }
  function switchTab(key){
    if(state.tab===key) return;
    clearTimer();
    state.tab = key;
    render();
  }
  function renderTopbarStreak(){
    var box = document.getElementById("topbarStreak");
    if(!box) return;
    if(store.streak.count>0){
      box.style.display="flex";
      box.textContent = "🔥 " + store.streak.count;
    } else {
      box.style.display="none";
    }
  }

  function render(){
    renderNav();
    renderTopbarStreak();
    var content = document.getElementById("tabContent");
    content.innerHTML = "";
    if(state.tab==="practice"){
      buildPracticeSkeleton(content);
      if(!state.queue.length) buildQueue();
      renderChips();
      renderQuiz();
    } else if(state.tab==="drawer"){
      renderDrawerTab(content);
    } else if(state.tab==="challenges"){
      renderChallengesTab(content);
    } else {
      renderProfileTab(content);
    }
  }

  render();

  // --- installable app (add to home screen) ---
  try{
    window.addEventListener("beforeinstallprompt", function(e){
      e.preventDefault();
      deferredInstallPrompt = e;
      var btn = document.getElementById("installBtn");
      if(btn) btn.style.display = "inline-flex";
    });
    window.addEventListener("appinstalled", function(){
      deferredInstallPrompt = null;
      var btn = document.getElementById("installBtn");
      if(btn) btn.style.display = "none";
    });
    if("serviceWorker" in navigator){
      window.addEventListener("load", function(){
        navigator.serviceWorker.register("sw.js").catch(function(){});
      });
    }
  }catch(e){}
})();
</script>
